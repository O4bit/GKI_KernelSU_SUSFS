name: Custom Android Kernel Build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== Dropdowns ====================
      kernel_version:
        description: "Kernel version"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "5.10"
      kernelsu_variant:
        description: "KernelSU variant"
        required: true
        type: choice
        options:
          - Official
          #- Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
        default: BakaSU
      ksu_mode:
        description: "KernelSU / SUSFS mode"
        required: true
        type: choice
        options:
          - "Off"
          - "Disable SUSFS"
          - "Disable KernelSU"
        default: "Off"
      use_kpm:
        description: "KPM support (patched mode is not yet supported)"
        required: true
        type: choice
        default: "Disabled"
        options:
          - "Disabled"
          - "Enabled"
          - "Patched (enable and apply patches, not yet supported)"
      droidspaces:
        description: "Droidspaces container support (slot patches for 5.10–6.6, on/off for 6.12)"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "Which build artifacts to upload"
        required: true
        type: choice
        options:
          - "Upload AnyKernel3.zip only"
          - "Upload all artifacts"
        default: "Upload AnyKernel3.zip only"

      # ==================== Text inputs ====================
      os_patch_level:
        description: "Security patch level (for example, 2022-01 or lts)"
        required: true
        type: string
        default: "2022-01"
      version:
        description: "Custom version name (optional)"
        required: false
        type: string
      build_time:
        description: "Custom build time (optional, enter N or leave blank to use the current UTC time)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== Toggles (off by default) ====================
      use_zram:
        description: "Enable enhanced ZRAM algorithms"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG protection against factory resets"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "Enable the Re-Kernel driver"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "Enable the NoMount mounting metamodule"
        required: false
        type: boolean
        default: false
      use_networking:
        description: "Enable networking enhancements (BBRv3 / IPSet / Qdisc / CIFS)"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply the rtmutex patch series for CVE-2026-43499"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "Enable OnePlus 8E support"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "Enable NTSync for Droidspaces containers (requires Droidspaces)"
        required: false
        type: boolean
        default: false

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      android_version: ${{ steps.resolve.outputs.android_version }}
      sub_level: ${{ steps.resolve.outputs.sub_level }}
      kernel_full: ${{ steps.resolve.outputs.kernel_full }}
    steps:
      - name: Check out version data
        uses: actions/checkout@v7

      - name: Find the kernel version for the selected security patch level
        id: resolve
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          kernel_version = os.environ["KERNEL_VERSION"]
          os_patch_level = os.environ["OS_PATCH_LEVEL"].strip()
          android_map = {
              "5.10": "android12",
              "5.15": "android13",
              "6.1": "android14",
              "6.6": "android15",
              "6.12": "android16",
          }
          android_version = android_map.get(kernel_version)
          if android_version is None:
              print(f"::error::Unsupported kernel version: {kernel_version}")
              sys.exit(1)

          data_path = Path("data") / android_version / f"{kernel_version}.json"

          if not data_path.exists():
              print(f"::error::Version data file not found: {data_path}")
              sys.exit(1)

          with data_path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if os_patch_level == "lts":
              kernel_full = data.get("lts")
              if not kernel_full:
                  print(f"::error::Missing LTS version data for {android_version} / {kernel_version}")
                  sys.exit(1)
              sub_level = "X"
          else:
              matched = next(
                  (entry for entry in data.get("entries", []) if entry.get("date") == os_patch_level),
                  None,
              )
              if matched is None:
                  print(f"::error::No version data found for {android_version} / {kernel_version} / {os_patch_level}")
                  sys.exit(1)
              kernel_full = matched.get("kernel", "")
              prefix = f"{kernel_version}."
              if not kernel_full.startswith(prefix):
                  print(f"::error::Invalid version data: {kernel_full} does not match kernel series {kernel_version}")
                  sys.exit(1)
              sub_level = kernel_full.rsplit(".", 1)[-1]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"android_version={android_version}\n")
              output.write(f"sub_level={sub_level}\n")
              output.write(f"kernel_full={kernel_full}\n")

          print(f"Resolved {android_version} / {kernel_full} (kernel sublevel: {sub_level})")
          PY

  build-custom-kernel:
    name: "${{ needs.resolve-version.outputs.kernel_full }}-${{ needs.resolve-version.outputs.android_version }}-${{ inputs.os_patch_level }}"
    needs: resolve-version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ needs.resolve-version.outputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ needs.resolve-version.outputs.sub_level }}
      os_patch_level: ${{ inputs.os_patch_level }}
      revision: "r1"
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: >-
        ${{ inputs.use_kpm == 'Enabled' && 'enabled (开启)' ||
            inputs.use_kpm == 'Patched (enable and apply patches, not yet supported)' && 'patched (开启并修补，尚不支持)' ||
            'disabled (关闭)' }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_networking: ${{ inputs.use_networking || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.ksu_mode != 'Disable SUSFS' && inputs.ksu_mode != 'Disable KernelSU' }}
      ksu_mode: >-
        ${{ inputs.ksu_mode == 'Disable SUSFS' && '禁用SUSFS' ||
            inputs.ksu_mode == 'Disable KernelSU' && '禁用KSU' ||
            '关闭' }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode == 'Upload all artifacts' && '上传全部' || '仅上传 AnyKernel3.zip' }}

  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
